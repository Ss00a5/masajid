<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل زيارات المساجد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe3;--card:#fffdf7;--ink:#1d2b24;--mut:#6a766f;--g:#1d5a43;--gt:#fff;--g2:#dfece4;--line:#e3dac6;--off:#f0d8c6;--offi:#8a4a28;--bad:#b3402a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a16;--card:#1a2620;--ink:#ece6d6;--mut:#9aa89f;--g:#4aa57e;--gt:#0c1511;--g2:#223a2e;--line:#2c3b33;--off:#3b2b21;--offi:#e2a37e;--bad:#e58770}}
:root[data-theme="dark"]{--bg:#111a16;--card:#1a2620;--ink:#ece6d6;--mut:#9aa89f;--g:#4aa57e;--gt:#0c1511;--g2:#223a2e;--line:#2c3b33;--off:#3b2b21;--offi:#e2a37e;--bad:#e58770}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
.w{max-width:1000px;margin:0 auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:1.5rem;margin:0;color:var(--g);font-weight:800}h3{margin:0 0 10px}h2{font-size:1.05rem;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--g);border-color:var(--g);font-weight:700}
.btn{background:var(--g);color:var(--gt);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.s{background:var(--g2);color:var(--g)}.btn.d{background:none;color:var(--bad);border:1px solid var(--bad)}.btn.m{padding:3px 10px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.st small{color:var(--mut);display:block}.st b{font-size:1.8rem;color:var(--g);line-height:1.2}
.bar{height:12px;background:var(--g2);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g);transition:width .4s}
.ok{background:var(--g);color:var(--gt);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.pace{background:var(--g2);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--g2);border-radius:20px;padding:4px 14px}.chip b{color:var(--g)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ch{text-align:center;color:var(--mut);font-size:.8rem}
.cd{min-height:48px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;cursor:pointer;position:relative;background:var(--card)}
.cd.off{background:var(--off);color:var(--offi)}.cd.td{outline:2px solid var(--g)}
.cd em{position:absolute;left:4px;bottom:3px;background:var(--g);color:var(--gt);border-radius:10px;padding:0 7px;font-style:normal;font-size:.8rem}
.lg{font-size:.8rem;color:var(--mut);margin-top:8px}.lg span{background:var(--off);color:var(--offi);border-radius:4px;padding:0 6px}
.ch2{display:flex;align-items:flex-end;gap:2px;height:110px}
.ch2 div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.65rem;color:var(--mut)}
.ch2 i{display:block;width:100%;background:var(--g);border-radius:3px 3px 0 0;min-height:2px}.ch2 i.z{background:var(--line)}
.mo div{gap:8px}.mo{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.mo div{height:110px}
input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
label{display:block;margin-bottom:10px;color:var(--mut);font-size:.9rem}label input,label select,label textarea{color:var(--ink);margin-top:3px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto;z-index:20}
.md{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:460px;margin-top:20px}
.err{color:var(--bad);min-height:1.3em;margin-bottom:6px}.hint{color:var(--g);margin:-4px 0 10px;font-size:.9rem}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g);color:var(--gt);padding:8px 18px;border-radius:20px;z-index:30;display:none}
.mut{color:var(--mut)}textarea{min-height:70px}
</style></head><body><div class="w">
<header><h1>🕌 سجل زيارات المساجد</h1>
<div class="row"><button class="btn" onclick="visitForm()">تسجيل زيارة</button><button class="btn s" onclick="mosqueForm()">إضافة مسجد</button></div></header>
<div id="cs" class="mut" style="font-size:.85rem;margin-bottom:6px"></div><nav><button data-t="home" onclick="go('home')">الرئيسية</button><button data-t="log" onclick="go('log')">سجل الزيارات</button><button data-t="mosques" onclick="go('mosques')">المساجد</button><button data-t="data" onclick="go('data')">التصدير والنسخ الاحتياطي</button></nav>
<main id="main"></main></div><div id="md"></div><div id="toast"></div>
<script>
const K='masajid-v1',DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],DS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'],
MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],PR=['الفجر','الظهر','العصر','المغرب','العشاء'],GOAL=30,OFF=[0,1];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),ym=d=>iso(d).slice(0,7);
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mname=id=>(S.mosques.find(m=>m.id===id)||{name:'(مسجد محذوف)'}).name;
const norm=s=>s.trim().replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&Array.isArray(s.mosques)&&Array.isArray(s.visits))return s}catch(e){}return{mosques:[],visits:[]}}
let DBR=null,cloud=false,wq=Promise.resolve();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
 if(!DBR||!cloud)return;
 wq=wq.then(()=>DBR.set(JSON.parse(JSON.stringify(S)))).catch(()=>toast('تعذّر الحفظ السحابي، تحقق من الاتصال'))}
let S=load(),tab='home',vm=ym(new Date()),F={mo:'',m:'',p:'',d:'',q:''},VD=null,BACK;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function go(t){tab=t;render()}
function modal(h){$('#md').innerHTML='<div class="ov"><div class="md">'+h+'</div></div>'}
function closeM(){$('#md').innerHTML=''}
function shift(n){const[y,m]=vm.split('-').map(Number),d=new Date(y,m-1+n,1);vm=ym(d);render()}

function stats(){
 const[y,m]=vm.split('-').map(Number),dim=new Date(y,m,0).getDate(),vs=S.visits.filter(v=>v.date.startsWith(vm)),done=vs.length,t=iso(new Date()),nowM=ym(new Date()),cur=vm===nowM,past=vm<nowM;
 let wl=0;if(!past)for(let d=1;d<=dim;d++){const ds=vm+'-'+pad(d);if(OFF.includes(pd(ds).getDay())||(cur&&ds<t))continue;wl++}
 const rem=Math.max(0,GOAL-done),by={};vs.forEach(v=>by[v.date]=(by[v.date]||0)+1);
 return{y,m,dim,vs,done,rem,wl,cur,past,by,t,pct:Math.min(100,Math.round(done/GOAL*100)),today:S.visits.filter(v=>v.date===t).length,avg:wl?rem/wl:0}
}
function home(){
 const s=stats(),f=new Date(s.y,s.m-1,1).getDay();
 const rows=S.mosques.map(m=>{const mv=S.visits.filter(v=>v.mosqueId===m.id);return{m,c:mv.filter(v=>v.date.startsWith(vm)).length,last:mv.map(v=>v.date).sort().pop()||''}}).sort((a,b)=>b.c-a.c||a.m.name.localeCompare(b.m.name,'ar'));
 const wk=Array(Math.ceil((f+s.dim)/7)).fill(0);s.vs.forEach(v=>wk[Math.floor((+v.date.slice(8)-1+f)/7)]++);
 let pace;
 if(s.done>=GOAL)pace='';
 else if(s.past)pace='<div class="pace">انتهى هذا الشهر، وكان الناقص '+s.rem+' زيارة عن الهدف.</div>';
 else if(!s.wl)pace='<div class="pace">لا توجد أيام عمل متبقية هذا الشهر. المتبقي '+s.rem+' زيارة.</div>';
 else pace='<div class="pace">المتبقي <b>'+s.rem+'</b> زيارة على <b>'+s.wl+'</b> يوم عمل'+(s.cur?' (من اليوم)':'')+': المتوسط المطلوب <b>'+s.avg.toFixed(1)+'</b> زيارة لكل يوم عمل، أي نحو '+Math.ceil(s.avg)+' يوميًا. يُعاد الحساب تلقائيًا بعد كل زيارة.</div>';
 let cal=DS.map(d=>'<div class="ch">'+d+'</div>').join('')+'<i></i>'.repeat(f),mx=Math.max(1,...Object.values(s.by)),bars='';
 for(let d=1;d<=s.dim;d++){const ds=s.y+'-'+pad(s.m)+'-'+pad(d),c=s.by[ds]||0,dw=pd(ds).getDay();
  cal+='<div class="cd'+(OFF.includes(dw)?' off':'')+(ds===s.t?' td':'')+'" onclick="visitOn(\''+ds+'\')"><b>'+d+'</b>'+(c?'<em>'+c+'</em>':'')+'</div>';
  bars+='<div title="'+ds+': '+c+'">'+(c||'')+'<i class="'+(c?'':'z')+'" style="height:'+(c/mx*80)+'%"></i><span>'+(d%5==0||d==1?d:'&nbsp;')+'</span></div>'}
 let mb='';for(let i=5;i>=0;i--){const d=new Date(s.y,s.m-1-i,1),k=ym(d),c=S.visits.filter(v=>v.date.startsWith(k)).length;
  mb+='<div>'+c+'<i class="'+(c?'':'z')+'" style="height:'+Math.min(100,c/GOAL*80)+'%;'+(c>=GOAL?'':'opacity:.7')+'"></i><span>'+MON[d.getMonth()]+'</span></div>'}
 return '<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn s m" onclick="shift(-1)">الشهر السابق</button><b style="font-size:1.1rem">'+MON[s.m-1]+' '+s.y+'</b><button class="btn s m" onclick="shift(1)">الشهر التالي</button></div>'
 +(s.done>=GOAL?'<div class="ok">🎉 ما شاء الله! أتممت هدف الشهر: '+s.done+' زيارة من '+GOAL+'.</div>':'')+pace
 +'<div class="grid"><div class="st"><small>زيارات الشهر</small><b>'+s.done+'</b></div><div class="st"><small>الهدف الشهري</small><b>'+GOAL+'</b></div><div class="st"><small>المتبقي</small><b>'+s.rem+'</b></div><div class="st"><small>نسبة الإنجاز</small><b>'+s.pct+'%</b><div class="bar"><i style="width:'+s.pct+'%"></i></div></div><div class="st"><small>عدد المساجد</small><b>'+S.mosques.length+'</b></div><div class="st"><small>زيارات اليوم</small><b>'+s.today+'</b></div></div>'
 +'<div class="card"><h2>الزيارات حسب الفرض</h2><div class="chips">'+PR.map(p=>'<span class="chip">'+p+' <b>'+s.vs.filter(v=>v.prayer===p).length+'</b></span>').join('')+'</div><h2 style="margin-top:14px">الزيارات حسب الأسبوع</h2><div class="chips">'+wk.map((c,i)=>'<span class="chip">أسبوع '+(i+1)+' <b>'+c+'</b></span>').join('')+'</div></div>'
 +'<div class="card"><h2>التقويم</h2><div class="cal">'+cal+'</div><div class="lg"><span>الأحد والاثنين</span> إجازة، ولا تُحتسب من أيام العمل. اضغط على أي يوم لتسجيل زيارة فيه.</div></div>'
 +'<div class="card"><h2>الزيارات اليومية</h2><div class="ch2">'+bars+'</div><h2 style="margin-top:16px">آخر ستة أشهر (الهدف '+GOAL+')</h2><div class="ch2 mo">'+mb+'</div></div>'
 +'<div class="card"><h2>المساجد</h2>'+(rows.length?'<div class="tw"><table><tr><th>المسجد</th><th>زيارات الشهر</th><th>آخر زيارة</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.m.name)+(r.m.area?' <span class="mut">('+esc(r.m.area)+')</span>':'')+'</td><td>'+r.c+'</td><td>'+(r.last?r.last+' '+DAYS[pd(r.last).getDay()]:'<span class="mut">لم تتم زيارته</span>')+'</td></tr>').join('')+'</table></div>':'<p class="mut">لا توجد مساجد بعد. ابدأ بإضافة مسجد.</p><button class="btn" onclick="mosqueForm()">إضافة مسجد</button>')+'</div>'
}
function log(){
 const months=[...new Set(S.visits.map(v=>v.date.slice(0,7)).concat(vm))].sort().reverse(),q=norm(F.q);
 const L=S.visits.filter(v=>(!F.mo||v.date.startsWith(F.mo))&&(!F.m||v.mosqueId===F.m)&&(!F.p||v.prayer===F.p)&&(F.d===''||pd(v.date).getDay()==F.d)&&(!q||norm(mname(v.mosqueId)).includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.at-a.at);
 const o=(a,sel)=>a.map(x=>'<option value="'+x[0]+'"'+(String(sel)===String(x[0])?' selected':'')+'>'+esc(x[1])+'</option>').join('');
 return '<div class="card"><div class="fl"><select onchange="F.mo=this.value;render()"><option value="">كل الأشهر</option>'+o(months.map(k=>[k,MON[+k.slice(5)-1]+' '+k.slice(0,4)]),F.mo)+'</select><select onchange="F.m=this.value;render()"><option value="">كل المساجد</option>'+o(S.mosques.map(m=>[m.id,m.name]),F.m)+'</select><select onchange="F.p=this.value;render()"><option value="">كل الفروض</option>'+o(PR.map(p=>[p,p]),F.p)+'</select><select onchange="F.d=this.value;render()"><option value="">كل الأيام</option>'+o(DAYS.map((d,i)=>[i,d]),F.d)+'</select></div><input id="sq" placeholder="ابحث باسم المسجد" value="'+esc(F.q)+'" oninput="F.q=this.value;const p=this.selectionStart;render();const e=$(\'#sq\');e.focus();e.setSelectionRange(p,p)"></div>'
 +'<div class="card"><h2>'+L.length+' زيارة</h2>'+(L.length?'<div class="tw"><table><tr><th>التاريخ</th><th>اليوم</th><th>المسجد</th><th>الفرض</th><th>ملاحظات</th><th></th></tr>'+L.map(v=>'<tr><td>'+v.date+'</td><td>'+DAYS[pd(v.date).getDay()]+'</td><td>'+esc(mname(v.mosqueId))+'</td><td>'+v.prayer+'</td><td>'+esc(v.notes)+'</td><td class="row" style="flex-wrap:nowrap"><button class="btn s m" onclick="visitForm(\''+v.id+'\')">تعديل</button><button class="btn d m" onclick="delVisit(\''+v.id+'\')">حذف</button></td></tr>').join('')+'</table></div>':'<p class="mut">لا توجد زيارات مطابقة.</p>')+'</div>'
}
function mosques(){
 return '<div class="card"><div class="row" style="justify-content:space-between"><h2>المساجد ('+S.mosques.length+')</h2><button class="btn" onclick="mosqueForm()">إضافة مسجد</button></div>'+(S.mosques.length?'<div class="tw"><table><tr><th>الاسم</th><th>الحي أو الموقع</th><th>ملاحظات</th><th>كل الزيارات</th><th></th></tr>'+S.mosques.map(m=>'<tr><td>'+esc(m.name)+'</td><td>'+esc(m.area)+'</td><td>'+esc(m.notes)+'</td><td>'+S.visits.filter(v=>v.mosqueId===m.id).length+'</td><td class="row" style="flex-wrap:nowrap"><button class="btn s m" onclick="mosqueForm(\''+m.id+'\')">تعديل</button><button class="btn d m" onclick="delMosque(\''+m.id+'\')">حذف</button></td></tr>').join('')+'</table></div>':'<p class="mut">لا توجد مساجد بعد.</p>')+'</div>'
}
function data(){
 return '<div class="card"><h2>التصدير والنسخ الاحتياطي</h2><p class="mut">بياناتك محفوظة سحابيًا في حسابك وتبقى حتى لو مسحت بيانات المتصفح. النسخة الاحتياطية اختيارية.</p><div class="row"><button class="btn" onclick="exportBox(\'csv\')">تصدير الزيارات (CSV لـ Excel)</button><button class="btn s" onclick="exportBox(\'json\')">نسخة احتياطية كاملة</button><button class="btn s" onclick="restoreBox()">استعادة نسخة</button></div></div>'
}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#main').innerHTML=tab=='home'?home():tab=='log'?log():tab=='mosques'?mosques():data()}

function visitOn(ds){VD={date:ds,mosqueId:'',prayer:'',notes:''};visitForm()}
function visitForm(id,mid){
 const b=id?S.visits.find(x=>x.id===id):null,v=Object.assign({},VD||b||{date:iso(new Date()),mosqueId:'',prayer:'',notes:''});VD=null;if(mid)v.mosqueId=mid;
 modal('<h3>'+(id?'تعديل زيارة':'تسجيل زيارة')+'</h3><label>التاريخ<input type="date" id="fd" value="'+v.date+'" oninput="dayLbl()"></label><div class="hint" id="fday"></div>'
 +'<label>المسجد</label><div class="row" style="margin:-8px 0 10px"><select id="fm" style="flex:1"><option value="">اختر المسجد</option>'+S.mosques.map(m=>'<option value="'+m.id+'"'+(m.id===v.mosqueId?' selected':'')+'>'+esc(m.name)+'</option>').join('')+'</select><button class="btn s" onclick="newFromVisit(\''+(id||'')+'\')">مسجد جديد</button></div>'
 +'<label>الفرض<select id="fp"><option value="">اختر الفرض</option>'+PR.map(p=>'<option'+(p===v.prayer?' selected':'')+'>'+p+'</option>').join('')+'</select></label><label>ملاحظات (اختياري)<textarea id="fn">'+esc(v.notes)+'</textarea></label><div class="err" id="fe"></div><div class="row"><button class="btn" onclick="saveVisit(\''+(id||'')+'\')">حفظ الزيارة</button><button class="btn s" onclick="closeM()">إلغاء</button></div>');dayLbl()
}
function dayLbl(){const v=$('#fd').value;$('#fday').textContent=v?'اليوم: '+DAYS[pd(v).getDay()]+(OFF.includes(pd(v).getDay())?' (يوم إجازة)':''):''}
function newFromVisit(id){VD={date:$('#fd').value,mosqueId:'',prayer:$('#fp').value,notes:$('#fn').value};mosqueForm(null,id)}
function saveVisit(id){
 const date=$('#fd').value,mosqueId=$('#fm').value,prayer=$('#fp').value,notes=$('#fn').value.trim();
 if(!date||!mosqueId||!prayer){$('#fe').textContent='اختر التاريخ والمسجد والفرض.';return}
 if(S.visits.some(v=>v.id!==id&&v.date===date&&v.mosqueId===mosqueId&&v.prayer===prayer)&&!confirm('يوجد سجل لهذا المسجد في اليوم والفرض نفسيهما. هل هي زيارة فعلية منفصلة؟'))return;
 closeM();
 if(id)Object.assign(S.visits.find(v=>v.id===id),{date,mosqueId,prayer,notes});else S.visits.push({id:uid(),date,mosqueId,prayer,notes,at:Date.now()});
 save();render();toast('تم حفظ الزيارة')
}
function delVisit(id){if(!confirm('حذف هذه الزيارة؟ لن تُحتسب ضمن الإجمالي.'))return;S.visits=S.visits.filter(v=>v.id!==id);save();render();toast('تم الحذف')}
function mosqueForm(id,back){
 BACK=back;const m=id?S.mosques.find(x=>x.id===id):{name:'',area:'',notes:''};
 modal('<h3>'+(id?'تعديل مسجد':'إضافة مسجد')+'</h3><label>اسم المسجد (إلزامي)<input id="mn" value="'+esc(m.name)+'"></label><label>الحي أو الموقع (اختياري)<input id="ma" value="'+esc(m.area)+'"></label><label>ملاحظات (اختياري)<textarea id="mt">'+esc(m.notes)+'</textarea></label><div class="err" id="me"></div><div class="row"><button class="btn" onclick="saveMosque(\''+(id||'')+'\')">حفظ المسجد</button><button class="btn s" onclick="cancelMosque()">إلغاء</button></div>')
}
function cancelMosque(){if(BACK!==undefined)visitForm(BACK||null);else closeM()}
function saveMosque(id){
 const name=$('#mn').value.trim().replace(/\s+/g,' '),area=$('#ma').value.trim(),notes=$('#mt').value.trim();
 if(!name){$('#me').textContent='اسم المسجد مطلوب.';return}
 if(S.mosques.some(m=>m.id!==id&&norm(m.name)===norm(name)&&norm(m.area)===norm(area))){$('#me').textContent='هذا المسجد مسجّل مسبقًا. إن كان مسجدًا آخر بالاسم نفسه فاكتب الحي لتمييزه.';return}
 let nid=id;if(id)Object.assign(S.mosques.find(m=>m.id===id),{name,area,notes});else{nid=uid();S.mosques.push({id:nid,name,area,notes})}
 save();toast('تم حفظ المسجد');
 if(BACK!==undefined){visitForm(BACK||null,nid)}else{closeM()}render()
}
function delMosque(id){const n=S.visits.filter(v=>v.mosqueId===id).length;if(!confirm('حذف المسجد'+(n?' وجميع زياراته ('+n+')':'')+'؟'))return;S.mosques=S.mosques.filter(m=>m.id!==id);S.visits=S.visits.filter(v=>v.mosqueId!==id);save();render()}

function dl(name,text,bom){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([(bom?'\ufeff':'')+text],{type:'text/plain'}));a.download=name;a.click()}catch(e){}}
function copyT(){const t=$('#xt');t.select();try{navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}toast('تم النسخ')}
function exportBox(k){
 const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"',csv=['التاريخ,اليوم,المسجد,الحي,الفرض,الملاحظات'].concat([...S.visits].sort((a,b)=>b.date.localeCompare(a.date)).map(v=>{const m=S.mosques.find(x=>x.id===v.mosqueId)||{};return[v.date,DAYS[pd(v.date).getDay()],q(m.name),q(m.area),v.prayer,q(v.notes)].join(',')})).join('\n'),js=JSON.stringify(S),t=k=='csv'?csv:js,fn=k=='csv'?'visits.csv':'masajid-backup.json';
 modal('<h3>'+(k=='csv'?'تصدير الزيارات':'نسخة احتياطية')+'</h3><p class="mut">اضغط «تنزيل»، وإن لم يبدأ التنزيل فانسخ النص والصقه في ملف باسم '+fn+(k=='csv'?' ثم افتحه في Excel':'')+'.</p><textarea id="xt" readonly style="min-height:150px">'+esc(t)+'</textarea><div class="row" style="margin-top:10px"><button class="btn" id="dlb">تنزيل</button><button class="btn s" onclick="copyT()">نسخ</button><button class="btn s" onclick="closeM()">إغلاق</button></div>');
 $('#dlb').onclick=()=>dl(fn,t,k=='csv')
}
function restoreBox(){modal('<h3>استعادة نسخة احتياطية</h3><p class="mut">الصق محتوى ملف النسخة الاحتياطية. سيحل محل البيانات الحالية.</p><textarea id="xt" style="min-height:150px"></textarea><div class="err" id="xe"></div><div class="row"><button class="btn" onclick="doRestore()">استعادة</button><button class="btn s" onclick="closeM()">إلغاء</button></div>')}
function doRestore(){try{const d=JSON.parse($('#xt').value.replace(/^\ufeff/,'').trim());if(!Array.isArray(d.mosques)||!Array.isArray(d.visits))throw 0;if(!confirm('استبدال البيانات الحالية بالنسخة؟'))return;S={mosques:d.mosques,visits:d.visits};save();closeM();render();toast('تمت الاستعادة')}catch(e){$('#xe').textContent='النسخة غير صالحة.'}}
render();
async function initCloud(){
 const cs=$('#cs');cs.textContent='جارٍ الاتصال بالتخزين الخاص…';
 try{const u=await claude.use('user'),db=await claude.use('db');if(!u||!db)throw 0;
  const id=await u.id(),ref=db.doc('data/users/'+id+'/state'),snap=await ref.get();
  DBR=ref;
  if(snap.exists){const d=snap.data();if(Array.isArray(d.mosques)&&Array.isArray(d.visits)){S={mosques:d.mosques,visits:d.visits};try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}}
  cloud=true;
  if(!snap.exists&&(S.mosques.length||S.visits.length))await ref.set(JSON.parse(JSON.stringify(S)));
  cs.textContent='☁️ بياناتك محفوظة سحابيًا في حسابك، ولا يراها أحد غيرك';render()
 }catch(e){cs.textContent='⚠️ التخزين السحابي غير متاح الآن، وبياناتك تُحفظ على هذا الجهاز فقط.'}
}
initCloud();
</script></body></html>
